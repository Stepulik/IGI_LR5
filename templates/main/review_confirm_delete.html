{% extends 'base.html' %}
{% block title %}Удалить отзыв{% endblock %}
{% block content %}
<div class="row justify-content-center">
<div class="col-md-6">
<div class="card border-0 shadow-sm p-4 text-center">
    <i class="bi bi-exclamation-triangle fs-1 text-danger mb-3"></i>
    <h4>Удалить отзыв?</h4>
    <p class="text-muted">{{ review.name }}: «{{ review.text|truncatewords:10 }}»</p>
    <form method="post" class="d-flex gap-2 justify-content-center">{% csrf_token %}
        <a href="{% url 'shop:reviews' %}" class="btn btn-outline-secondary px-4">Отмена</a>
        <button type="submit" class="btn btn-danger px-4">Удалить</button>
    </form>
</div>
</div>
</div>
{% endblock %}
