{% extends 'base.html' %}
{% block title %}Словарь терминов{% endblock %}
{% block content %}
<h2><i class="bi bi-book"></i> Словарь кондитерских терминов</h2>
<div class="accordion" id="glAcc">
{% for t in terms %}
<div class="accordion-item">
    <h2 class="accordion-header">
        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#t{{ t.pk }}">
            <strong>{{ t.term }}</strong><small class="text-muted ms-3">{{ t.created_at|date:"d/m/Y" }}</small>
        </button>
    </h2>
    <div id="t{{ t.pk }}" class="accordion-collapse collapse">
        <div class="accordion-body">{{ t.definition }}</div>
    </div>
</div>
{% empty %}<p class="text-muted mt-3">Словарь пуст.</p>
{% endfor %}
</div>
{% endblock %}
