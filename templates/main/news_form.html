{% extends 'base.html' %}
{% block title %}{{ title }} — СладкийДом{% endblock %}
{% block content %}
<div class="row justify-content-center">
<div class="col-lg-8">
<div class="form-panel">
    <div class="form-panel-header d-flex align-items-center gap-3">
        <i class="bi bi-newspaper fs-4"></i>
        <h5 class="mb-0">{{ title }}</h5>
    </div>
    <div class="form-panel-body">
        <form method="post" enctype="multipart/form-data">{% csrf_token %}
        <div class="row g-3">
        {% for field in form %}
        <div class="col-12">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<div class="text-danger small mt-1">{{ field.errors }}</div>{% endif %}
        </div>
        {% endfor %}
        </div>
        <hr>
        <div class="d-flex gap-2 justify-content-end">
            <a href="{% url 'shop:news' %}" class="btn btn-outline-secondary px-4">Отмена</a>
            <button type="submit" class="btn btn-primary px-5"><i class="bi bi-check2 me-1"></i> Сохранить</button>
        </div>
        </form>
    </div>
</div>
</div>
</div>
{% endblock %}
