{% extends 'base.html' %}
{% block title %}Редактировать отзыв{% endblock %}
{% block content %}
<div class="row justify-content-center">
<div class="col-lg-6">
<div class="card border-0 shadow-sm">
    <div class="card-header" style="background:var(--terra);color:white">Редактировать отзыв</div>
    <div class="card-body">
        <form method="post">{% csrf_token %}
        {% for field in form %}
        <div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}
        {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}</div>
        {% endfor %}
        <div class="d-flex gap-2 justify-content-end">
            <a href="{% url 'shop:reviews' %}" class="btn btn-outline-secondary">Отмена</a>
            <button type="submit" class="btn btn-primary">Сохранить</button>
        </div>
        </form>
    </div>
</div>
</div>
</div>
{% endblock %}
