{% extends 'base.html' %}
{% block title %}Удаление изделия{% endblock %}
{% block content %}
<div class="row justify-content-center">
<div class="col-md-5">
<div class="form-panel">
    <div class="form-panel-header" style="background:linear-gradient(135deg,#c62828,#e53935)">
        <div class="d-flex align-items-center gap-3">
            <i class="bi bi-trash3 fs-4"></i>
            <h5 class="mb-0">Подтверждение удаления</h5>
        </div>
    </div>
    <div class="form-panel-body text-center">
        <div class="mb-4">
            <div class="rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
                 style="width:72px;height:72px;background:#ffebee">
                <i class="bi bi-exclamation-triangle fs-2 text-danger"></i>
            </div>
            <h6 class="fw-bold">Удалить изделие?</h6>
            <p class="text-muted">«<strong>{{ product.name }}</strong>» будет удалено безвозвратно.</p>
        </div>
        <form method="post">{% csrf_token %}
        <div class="d-flex gap-3 justify-content-center">
            <a href="{% url 'shop:product_detail' product.pk %}" class="btn btn-pk-outline px-4">Отмена</a>
            <button type="submit" class="btn btn-danger px-4 fw-bold">
                <i class="bi bi-trash3 me-1"></i> Удалить
            </button>
        </div>
        </form>
    </div>
</div>
</div>
</div>
{% endblock %}
